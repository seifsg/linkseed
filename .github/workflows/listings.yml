# Linkseed automation. Deploys are not here: private-previews' preview.yml builds and ships `dist/`.
# ci: check, test and build every push and pull request.
# sync: turns a submission issue into listings/<slug>.json on main, then dispatches preview.yml.
# recheck: weekly ownership recheck of every listing.
name: listings

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  sync:
    # Label events matter only for the moderation labels; the form's own `submission` label would double-run.
    if: >-
      github.event_name == 'issues' &&
      (!endsWith(github.event.action, 'labeled') || contains(fromJSON('["spam","approved"]'), github.event.label.name))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    concurrency:
      group: sync-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Only the issue number crosses into the shell; the script reads the issue itself through the API.
      - run: node scripts/sync.ts "$ISSUE"
        env:
          ISSUE: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}

  recheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: recheck
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/recheck.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
